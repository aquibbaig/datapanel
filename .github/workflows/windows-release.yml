name: Windows Release
run-name: ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Release Windows App
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows/amd64
          - windows/arm64

    steps:
      - name: Validate release tag
        id: normalise_version
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RAW_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          windows_product_version="${version%%[-+]*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "windows_product_version=$windows_product_version" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.normalise_version.outputs.tag }}

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo "${{ matrix.platform }}" | sed -e 's/\//_/g' -e 's/amd64/x64/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalise platform name
        id: normalise_platform_name
        shell: bash
        run: |
          pname=$(echo "${{ matrix.platform }}" | sed 's/windows\///g')
          echo "pname=$pname" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.4"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Windows prerequisites
        shell: powershell
        run: choco install nsis jq -y

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Set release version
        shell: bash
        env:
          DATAPANEL_VERSION: ${{ steps.normalise_version.outputs.version }}
          DATAPANEL_WINDOWS_PRODUCT_VERSION: ${{ steps.normalise_version.outputs.windows_product_version }}
        run: |
          jq '.info.productVersion = env.DATAPANEL_WINDOWS_PRODUCT_VERSION' wails.json > tmp.json
          mv tmp.json wails.json
          jq '.version = env.DATAPANEL_VERSION' frontend/package.json > frontend/tmp.json
          mv frontend/tmp.json frontend/package.json

      - name: Build Windows portable app
        shell: bash
        run: |
          release_version="${{ steps.normalise_version.outputs.version }}"
          github_repo="${GITHUB_REPOSITORY#*/}"
          ldflags="-X datapanel/internal/updater.CurrentVersion=$release_version -X datapanel/internal/updater.CurrentReleaseHash=$release_version -X datapanel/internal/updater.GitHubOwner=$GITHUB_REPOSITORY_OWNER -X datapanel/internal/updater.GitHubRepo=$github_repo"
          CGO_ENABLED=1 wails build -clean -skipbindings -nosyncgomod -platform "${{ matrix.platform }}" -webview2 embed -ldflags "$ldflags"

      - name: Compress portable binary
        working-directory: ./build/bin
        shell: powershell
        run: |
          $zip = "DataPanel_Portable_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.zip"
          Compress-Archive -Path "DataPanel.exe" -DestinationPath $zip
          $hash = Get-FileHash -Algorithm SHA256 $zip
          "$($hash.Hash.ToLower())  $zip" | Set-Content -Encoding ascii "$zip.sha256"

      - name: Upload release asset (Portable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.normalise_version.outputs.tag }}
          files: |
            ./build/bin/DataPanel_Portable_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.zip
            ./build/bin/DataPanel_Portable_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.zip.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows NSIS installer
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          release_version="${{ steps.normalise_version.outputs.version }}"
          github_repo="${GITHUB_REPOSITORY#*/}"
          ldflags="-X datapanel/internal/updater.CurrentVersion=$release_version -X datapanel/internal/updater.CurrentReleaseHash=$release_version -X datapanel/internal/updater.GitHubOwner=$GITHUB_REPOSITORY_OWNER -X datapanel/internal/updater.GitHubRepo=$github_repo"
          CGO_ENABLED=1 wails build -clean -skipbindings -nosyncgomod -platform "${{ matrix.platform }}" -nsis -webview2 embed -ldflags "$ldflags"

      - name: Rename installer
        shell: powershell
        run: |
          $installerName = "DataPanel_Setup_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.exe"
          $installerPath = Join-Path $env:GITHUB_WORKSPACE "build/bin/$installerName"
          $installer = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "*installer.exe" |
            Where-Object { $_.FullName -ne $installerPath } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $installer) {
            Write-Host "Executables produced by the Windows build:"
            Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "build") -Recurse -File -Filter "*.exe" |
              ForEach-Object { Write-Host " - $($_.FullName)" }
            throw "No NSIS installer was produced."
          }
          Move-Item -Path $installer.FullName -Destination $installerPath -Force
          $hash = Get-FileHash -Algorithm SHA256 $installerPath
          "$($hash.Hash.ToLower())  $installerName" | Set-Content -Encoding ascii "$installerPath.sha256"

      - name: Upload release asset (Installer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.normalise_version.outputs.tag }}
          files: |
            ./build/bin/DataPanel_Setup_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.exe
            ./build/bin/DataPanel_Setup_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.exe.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
