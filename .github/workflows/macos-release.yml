name: macOS Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS .app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Datapanel.app
        env:
          DATAPANEL_RELEASE_HASH: ${{ github.sha }}
          DATAPANEL_GITHUB_OWNER: ${{ github.repository_owner }}
          DATAPANEL_GITHUB_REPO: ${{ github.event.repository.name }}
        run: ./scripts/build-mac-app.sh

      - name: Package app bundle
        id: package
        run: |
          set -euo pipefail
          mkdir -p build/dist
          short_sha="${GITHUB_SHA::7}"
          zip_path="build/dist/Datapanel-macOS.zip"
          ditto -c -k --keepParent build/bin/datapanel.app "$zip_path"
          shasum -a 256 "$zip_path" > "${zip_path}.sha256"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${zip_path}.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=macos-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Datapanel-macOS
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.package.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" "$ZIP_PATH" "$CHECKSUM_PATH" \
            --target "$GITHUB_SHA" \
            --title "Datapanel macOS ${GITHUB_SHA::7}" \
            --notes "Automated macOS app build from main at ${GITHUB_SHA}."
